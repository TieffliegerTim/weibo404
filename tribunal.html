async function makeDossier(c){

${list}`);

 if(ph==="verdict"){
  const v=(S.verdict||{})[c],o=tally("vopen",c),s=tally("vsecret",c);
  if(!st.rev) return W("h-vd"+c,`<div><p class="k">THE VOTES</p></div><div class="cols"><div class="vcard"><span class="k">OPEN VOTE · JURY · NAMES VISIBLE</span><span class="stat red">${o.p}%</span><p>guilty (${o.g} of ${o.n})</p></div><div class="vcard"><span class="k">SECRET BALLOT · EVERYONE · ANONYMOUS</span><span class="stat" style="color:var(--blue)">${s.p}%</span><p>guilty (${s.g} of ${s.n})</p></div></div><p class="clerk">${Math.abs(o.p-s.p)>=10?`A gap of ${Math.abs(o.p-s.p)} points between what was said in public and what was voted in secret.`:"Public and secret votes are close."} ${v?"The court has reached its verdicts.":"The court is deliberating…"}</p>`);
  return W("h-vdr"+c+(v?1:0),v?`<div class="cols"><div class="vcard"><span class="k">A COURT IN CHINA 中华人民共和国</span><span class="vv ${/not/i.test(v.cn.v)?"n":"g"}">${esc(v.cn.v)}</span><p><b>${esc(v.cn.sentence)}</b></p><p>${esc(v.cn.reason)}</p></div><div class="vcard"><span class="k">A COURT IN SWITZERLAND</span><span class="vv ${/not/i.test(v.ch.v)?"n":"g"}">${esc(v.ch.v)}</span><p><b>${esc(v.ch.sentence)}</b></p><p>${esc(v.ch.reason)}</p></div></div><p class="reality">${esc(K.reality)}</p><p class="src">Verdicts: ${esc(v.src||"")} · simulated, not legal advice · Reality: ${esc(K.src)}</p>`:`<h1 class="hero1" style="font-size:72px">The court is deliberating…</h1>`);
 }
 if(ph==="guess"){
  W("h-gs",`<div><p class="k">SOMEONE ON THE JURY WORKED FOR STATE SECURITY</p><h1 class="hero1" style="font-size:86px">Who was the informant? <span class="zh red">线人</span></h1></div><div class="tally" id="tl"></div>`);
  $("#tl").innerHTML=`<div><span class="count">${Object.keys(S.guess||{}).length}</span><span class="mute">suspicions filed</span></div>`;
  return;
 }
 if(ph==="finale"){
  const inf=Object.keys(P).filter(id=>P[id].inf),G=Object.values(S.guess||{}),hit=G.filter(g=>inf.includes(g)).length;
  const conv=[0,1].filter(i=>tally("vopen",i).n).map(i=>({i,t:tally("vopen",i)}));
  const best=[0,1].map(i=>dos(i)?.best?{...dos(i).best,i}:null).filter(Boolean);
  W("h-fi"+inf.join()+G.length+best.length,`<div class="cols"><div class="side"><p class="k">THE INFORMANT${inf.length>1?"S":""}</p><h1 class="hero1" style="font-size:80px;color:var(--red2)">${inf.map(nameOf).map(esc).join(" & ")||"nobody"}</h1><p class="sub">${G.length?`${hit} of ${G.length} suspected the right person (${Math.round(hit/G.length*100)}%).`:"Nobody filed a suspicion."}</p>${conv.map(x=>`<p class="clerk">Case ${x.i+1}: the open jury vote was ${x.t.p}% guilty – mission ${x.t.p>50?"<b class='red'>accomplished</b>":"failed"} for State Security.</p>`).join("")}</div><div class="side"><p class="k">GOLDEN HAMMER 金槌 · BEST ARGUMENT</p>${best.map(b=>`<div class="hammer"><span class="k">Case ${b.i+1} · ${b.side==="pros"?"Prosecution":"Defence"} · ${esc(nameOf(b.cid))}</span><q>${esc(b.text)}</q>${b.why?`<span class="mute">${esc(b.why)}</span>`:""}</div>`).join("")||`<p class="mute">No arguments were scored.</p>`}</div></div>`);
 }
}
function ctrl(){
 const st=S.state||{phase:"lobby"},c=st.case||0,ph=st.phase;
 const b=(a,t,p)=>`<button class="cb ${p?"p":""}" data-a="${a}">${t}</button>`;
 let m=ph!=="lobby"?b("prev","◀ Back"):"";
 if(ph==="lobby")m+=b("next","Open the trial ▶",1);
 if(ph==="charge")m+=b("next","Start arguments (4 min) ▶",1);
 if(ph==="args")m+=b("plus","+30 s")+b("next","Close the files ▶",1);
 if(ph==="dossier")m+=b("next","Prosecution pleads ▶",1);
 if(ph==="plea")m+=b("plus","+30 s")+b("next",st.sub==="pros"?"Defence pleads ▶":st.sub==="def"?"Jury question ▶":"Open vote ▶",1);
 if(ph==="vopen")m+=b("next","Secret ballot ▶",1);
 if(ph==="vsecret")m+=b("next","Show the votes ▶",1);
 if(ph==="verdict")m+=!st.rev?b("next","Court verdicts ▶",1):(c===0?b("appeal","Appeal: Ai Weiwei ▶",1):"")+b("next","Who was the informant? ▶",c!==0);
 if(ph==="guess")m+=b("next","Unmask ▶",1);
 return `<div class="ctrl">${m}<span class="sp"></span><span class="prog">Space / → = next step</span>${b("reset","Reset session")}</div>`;
}
function bindCtrl(){$$(".cb[data-a]").forEach(x=>x.onclick=()=>act(x.dataset.a,x))}
let resetArm=0;
async function act(a,el){
 const st=S.state||{phase:"lobby",case:0},c=st.case||0,u=o=>update(R("state"),o),ph=st.phase;
 if(a==="next"){
  if(ph==="lobby"){assignInformants();return u({phase:"charge",case:0,rev:false,sub:null})}
  if(ph==="charge")return u({phase:"args",endsAt:now()+T_ARGS*1000});
  if(ph==="args")return u({phase:"dossier"});
  if(ph==="dossier")return u({phase:"plea",sub:"pros",endsAt:now()+T_PLEA*1000});
  if(ph==="plea"){if(st.sub==="pros")return u({sub:"def",endsAt:now()+T_PLEA*1000});if(st.sub==="def")return u({sub:"q",endsAt:now()+T_Q*1000});return u({phase:"vopen",sub:null})}
  if(ph==="vopen")return u({phase:"vsecret"});
  if(ph==="vsecret")return u({phase:"verdict",rev:false});
  if(ph==="verdict")return st.rev?u({phase:"guess"}):u({rev:true});
  if(ph==="guess")return u({phase:"finale"});
  return;
 }
 if(a==="appeal")return u({phase:"charge",case:1,rev:false,sub:null});
 if(a==="plus")return u({endsAt:Math.max(st.endsAt||0,now())+30000});
 if(a==="prev"){
  if(ph==="charge")return c===1?u({phase:"verdict",case:0,rev:true}):u({phase:"lobby"});
  if(ph==="plea"&&st.sub!=="pros")return u({sub:st.sub==="q"?"def":"pros",endsAt:now()+T_PLEA*1000});
  if(ph==="verdict"&&st.rev)return u({rev:false});
  const B={args:"charge",dossier:"args",plea:"dossier",vopen:"plea",vsecret:"vopen",verdict:"vsecret",guess:"verdict",finale:"guess"};
  if(ph==="vopen")return u({phase:"plea",sub:"q"});
  if(ph==="guess")return u({phase:"verdict",rev:true});
  return B[ph]&&u({phase:B[ph]});
 }
 if(a==="reset"){
  if(Date.now()-resetArm>3000){resetArm=Date.now();el.textContent="Click again to wipe everything";return}
  busyH.clear();return set(R(),{state:{phase:"lobby",case:0}});
 }
}
if(HOST) addEventListener("keydown",e=>{
 if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
 const st=S.state||{};
 if(e.key===" "||e.key==="ArrowRight"){e.preventDefault();if(st.phase!=="finale")act("next")}
 if(e.key==="ArrowLeft")act("prev");
});
setInterval(()=>{const st=S.state||{};$$("[data-end]").forEach(el=>{const left=(st.endsAt||0)-now();el.textContent=fmt(left);el.classList.toggle("low",left<15000)})},250);
onValue(R(),s=>{
 S=s.val()||{};
 if(!S.state&&HOST) set(R("state"),{phase:"lobby",case:0});
 try{HOST?renderHost():renderPhone()}catch(e){console.error("[trb]",e)}
},e=>{$("#app").innerHTML=`<div class="ph"><div class="wait"><h2>Connection blocked</h2><p class="mute">${esc(e.message)}</p></div></div>`});
if(HOST) getModel();
</script>
</body>
