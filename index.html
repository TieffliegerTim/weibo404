.tb{height:40px;min-width:40px;padding:0 11px;border-radius:11px;background:#1c1a1a;border:1px solid var(--line);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;flex:none}

.case{background:var(--paper);color:#1b1b1b;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}

.truth.c{background:var(--red);color:#fff}.truth.a{background:var(--gold);color:#111}
.bm{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(1200px 700px at 85% -10%,#2a0b10 0%,transparent 60%),var(--bg)}

.bm header .logo{font-size:20px}.bm header .logo i{width:40px;height:40px;font-size:15px;border-radius:12px}
.bm header .sp{flex:1}
.stage{padding:20px 36px;display:grid;gap:32px;align-items:stretch}
.lob{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:center}
.lob h1{font-size:clamp(48px,5.6vw,92px);line-height:.95}
.lob .sub{font-size:22px;color:#cfcac4;max-width:34ch;margin-top:18px}
.qrbox{background:#fff;border-radius:28px;padding:26px;display:flex;flex-direction:column;align-items:center;gap:14px;color:#111;justify-self:center;box-shadow:0 30px 80px #e6162d33}

.crt{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:center}
.tile{aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative;background:#1a1919;animation:pop .4s both}

.scan{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0 45%,#e6162d66 50%,transparent 55%);background-size:100% 220%;animation:scan 1.4s linear infinite}

.vt{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center}

.vt .post .tx{font-size:19px}
.vt .codes{font-size:14px}
.panel{display:flex;flex-direction:column;gap:16px;justify-content:center}
.k{font-size:15px;color:var(--mute);font-weight:700}
.bars{display:flex;flex-direction:column;gap:12px}
.brow{display:grid;grid-template-columns:220px 1fr 80px;gap:14px;align-items:center;font-size:20px;font-weight:800}

.lb{display:flex;flex-direction:column;gap:10px}
.lbr{display:grid;grid-template-columns:44px 84px 1fr;gap:12px;align-items:center;background:#161414;border:1px solid var(--line);border-radius:14px;padding:8px}

.tl{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));align-items:start;position:relative;margin:18px 0 8px}

.ev{display:flex;flex-direction:column;gap:8px;padding-right:14px;position:relative}

.ev span{font-size:15px;line-height:1.35;color:#d9d3cc}

</style>

  $("#sc").textContent=ids.length; $("#sc2").textContent=`of ${players.length} have posted`;
  $("#tiles").innerHTML=ids.sort((a,b)=>subs[a].t-subs[b].t).map(id=>`<div class="tile"><img alt="" src="${subs[id].img}">${ai[id]&&ai[id].t===subs[id].t?`<span>screened ✓</span>`:`<div class="scan"></div><span>scanning…</span>`}</div>`).join("");
  return;
 }
 if(st.phase==="vote"){
  const id=order()[st.cur], sub=subs[id];
  if(!sub){mount("h-none",`<div class="bm">${head}<section class="stage"><h1>No posts yet.</h1></section>${ctrl()}</div>`,bindCtrl);return}
  const a=ai[id], p=aiP(a);
  mount("h-vote"+st.cur+(st.revealed?"r":"")+(a?a.t:""),`<div class="bm">${head}<section class="stage vt">
   ${postHTML(sub,id,{verdict:st.revealed?classVerdict(id):null})}
   <div class="panel"><p class="k">THE ROOM VOTES</p><div class="bars" id="bars"></div>
    <div class="aibox">${st.revealed&&a?`<div class="top"><span class="lock">AI</span><span class="k" style="margin:0">CENSOR-AI · PROBABILITY OF DELETION ON WEIBO</span></div>
     <div class="pbig"><span class="pnum ${p>=50?"c":"a"}">${p}%</span><span class="act">${esc(a.action||"")}</span></div>
     <div class="meter ai"><i style="width:${p}%"></i></div>
     <div class="tags">${(a.triggers||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
     <p class="why">${esc(a.reason)}</p><p class="mute" style="font-size:17px">Critical message: ${a.crit??"–"}/100 · ${esc(a.style||"")} · smuggler score ${score(a)}</p>${a.account?`<p class="mute" style="font-size:17px">Account: ${esc(a.account)}</p>`:""}<p class="src">${esc(a.src||"")} · simulated estimate, not a real Weibo decision</p>`:
     `<div class="sealed"><span class="lock">AI</span>${a?"CENSOR-AI has calculated the risk. Sealed until the reveal.":"CENSOR-AI is still looking…"}</div>`}</div>
   </div></section>${ctrl()}</div>`,bindCtrl);
  const v=votesFor(id);
  $("#hp").textContent=`Post ${st.cur+1} / ${order().length}`;
  $("#bars").innerHTML=st.revealed?
   `<div class="brow"><span class="zh">删除 Censor</span><div class="btrack"><i style="width:${v.p}%;background:var(--red)"></i></div><span class="n">${v.p}%</span></div>
    <div class="brow"><span class="zh">放行 Allow</span><div class="btrack"><i style="width:${v.n?100-v.p:0}%;background:var(--gold)"></i></div><span class="n">${v.n?100-v.p:0}%</span></div>`:
   `<div class="brow" style="grid-template-columns:1fr"><span><span class="count">${v.n}</span> <span class="mute">of ${players.length} votes in · hidden until reveal</span></span></div>`;
  return;
 }
 if(st.phase==="reality"){
  const i=st.rcur||0,c=REAL[i];
  mount("h-real"+i+(st.rrev?"r":""),`<div class="bm">${head}<section class="stage rl">
   <div class="case"><div class="meta"><b>${esc(c.y)}</b><span>${esc(c.pl)}</span></div><div class="q">${esc(c.q)}</div></div>
   <div class="panel"><p class="k">REALITY CHECK – WHAT DID THE REAL CENSOR DO?</p><div class="bars" id="bars"></div>
   ${st.rrev?`<div class="truth ${c.t}"><b class="zh" style="font-size:28px">${c.t==="c"?"已删除 · CENSORED":"已通过 · STAYED UP"}</b><br>${esc(c.w)}</div><p class="src">Source: ${esc(c.s)}</p>`:""}</div>
  </section>${ctrl()}</div>`,bindCtrl);
  const v=rvFor(i);
  $("#hp").textContent=`Reality check ${i+1} / ${REAL.length}`;
  $("#bars").innerHTML=st.rrev?
   `<div class="brow"><span>Room: censored</span><div class="btrack"><i style="width:${v.p}%;background:var(--red)"></i></div><span class="n">${v.p}%</span></div>
    <div class="brow"><span>Room: stayed up</span><div class="btrack"><i style="width:${v.n?100-v.p:0}%;background:var(--gold)"></i></div><span class="n">${v.n?100-v.p:0}%</span></div>`:
   `<div class="brow" style="grid-template-columns:1fr"><span><span class="count">${v.n}</span> <span class="mute">guesses in</span></span></div>`;
  return;
 }
 if(st.phase==="final"){
  const ids=order().filter(id=>subs[id]);
  const gone=ids.filter(id=>classVerdict(id)==="CENSOR"), kept=ids.filter(id=>classVerdict(id)!=="CENSOR");
  const withAI=ids.filter(id=>ai[id]); const agree=withAI.filter(id=>ai[id].verdict===classVerdict(id)).length;
  const avgP=withAI.length?Math.round(withAI.reduce((s,id)=>s+aiP(ai[id]),0)/withAI.length):0;
  let rt=0,rn=0; REAL.forEach((c,i)=>{Object.values((S.rvotes||{})[i]||{}).forEach(x=>{rn++;if((x===1)===(c.t==="c"))rt++})});
  const g=l=>l.map(id=>`<div class="mini ${classVerdict(id)==="CENSOR"?"gone":""}"><img alt="" src="${subs[id].img}"></div>`).join("")||`<p class="mute">none</p>`;
  mount("h-final"+ids.length+agree+rn,`<div class="bm">${head}<section class="stage fin">
   <div class="col"><p class="k">PUBLIC TRANSCRIPT · 已通过</p><div class="stat" style="color:var(--gold)">${kept.length}</div><p class="mute">posts the room let through</p><div class="minig">${g(kept)}</div></div>
   <div class="col"><p class="k">HIDDEN TRANSCRIPT · 已删除</p><div class="stat red">${gone.length}</div><p class="mute">posts the room deleted</p><div class="minig">${g(gone)}</div></div>
   <div class="col"><p class="k">BEST SMUGGLERS · critical message, low risk</p><div class="lb">${board().slice(0,3).map((r,i)=>`<div class="lbr"><span class="rk">${i+1}</span><img alt="" src="${r.sub.img}"><div><div class="nm2">${esc(r.sub.name)} · ${r.s} pts</div><div class="sc">critical ${r.a.crit||0} × survival ${100-aiP(r.a)}%</div></div></div>`).join("")||`<p class="mute">no scores yet</p>`}</div>
    <p class="quote">Score = how critical × how likely it survives. Resistance in China lives inside that trade-off.</p></div>
  </section>${ctrl()}</div>`,bindCtrl);
 }
}
function renderTheory(head){
 const subs=S.subs||{},ai=S.ai||{};const ids=order().filter(id=>subs[id]&&ai[id]);const A=ids.map(id=>ai[id]);
 const avg=l=>l.length?Math.round(l.reduce((s,a)=>s+aiP(a),0)/l.length):null;
 const pct=(n,d)=>d?Math.round(n/d*100):0;
 const fm=v=>v===null?"–":v+"%";
 const crit=A.filter(a=>(a.crit||0)>=40), coded=crit.filter(a=>a.style==="coded"), open=crit.filter(a=>a.style==="open");
 const coll=A.filter(a=>a.topic==="collective"||a.topic==="june4"), lead=A.filter(a=>a.topic==="leader");
 const safe=A.filter(a=>(a.crit||0)<30);
 const roomP=ids.length?Math.round(ids.reduce((s,id)=>s+votesFor(id).p,0)/ids.length):0, aiAvg=avg(A)??0;
 const war=A.filter(a=>a.topic==="war"), warAnti=war.filter(a=>(a.crit||0)>=50), warPro=war.filter(a=>(a.crit||0)<50);
 const C=[
  ["Hidden transcripts","James C. Scott (1990)",`${pct(coded.length,crit.length)}%`,`of your critical posts hid behind codes. Deletion risk coded: ${fm(avg(coded))} · open: ${fm(avg(open))}.`,"Under domination, critique moves into code. Pooh and the grass-mud horse are what Scott calls infrapolitics."],
  ["Collective action is the red line","King, Pan & Roberts (2013)",fm(avg(coll)),`average risk for protest and June 4 codes, vs. ${fm(avg(lead))} for mocking the leader.`,"The state tolerates grumbling far more than anything that could bring people onto the street."],
  ["Fear works – even in a game","Margaret Roberts (2018)",`${pct(safe.length,A.length)}%`,`of you posted something barely critical (critical score below 30).`,"Self-censorship is cheaper than deleting: fear, friction and flooding do most of the work."],
  ["Gut feeling vs. the system","Room vs. CENSOR-AI",`${roomP}% / ${aiAvg}%`,`average vote to delete vs. average AI deletion risk. You were ${roomP>aiAvg?"stricter":"more lenient"} than the machine.`,"From outside, China's red lines are easy to misjudge – in both directions."],
  ["Censorship as foreign policy","Russia–Ukraine war",war.length?`${fm(avg(warAnti))} / ${fm(avg(warPro))}`:"6 cases",war.length?`deletion risk for anti-war vs. pro-Russia posts.`:`Reality check: “Putin the Great” stayed up, the historians' anti-war letter was deleted.`,"What may be said about the war follows Beijing's partnership with Moscow."]
 ];
 mount("h-theory"+A.length+roomP,`<div class="bm">${head}<section class="stage th">${C.map(([h,s,big,txt,take])=>`<div class="tc"><h3>${esc(h)}</h3><span class="src">${esc(s)}</span><div class="big">${esc(big)}</div><p>${esc(txt)}</p><p class="mute" style="font-size:15px">${esc(take)}</p></div>`).join("")}</section>${ctrl()}</div>`,bindCtrl);
 $("#hp").textContent="What your memes tell us";
}
const ENEMY=[
 ["1998","Golden Shield","The Ministry of Public Security's project that becomes the backbone of the Great Firewall."],
 ["2009","Walls go up","Twitter and Facebook are blocked; Sina Weibo launches as the controllable alternative."],
 ["2013","Rumour rule","A 'rumour' reposted 500 times can bring up to three years in prison; big influencers are detained."],
 ["2014","Xi takes the wheel","A new central cyber leading group, chaired by Xi; the CAC becomes the chief censor."],
 ["2017","Cybersecurity Law","Real-name registration becomes law; platforms are liable for what users post."],
 ["2018","Party commission","The cyber group becomes a Party commission – the year the letter N was blocked."],
 ["2022","Location shown","Weibo displays every user's province; after the A4 protests police check phones."],
 ["2025","Cyber ID","A state 'network ID' for logging in to apps launches, voluntary for now."],
 ["Today","AI moderation","Filters, AI and human reviewers work together – like CENSOR-AI today."]
];
function renderEnemy(head){
 mount("h-enemy",`<div class="bm">${head}<section class="stage" style="align-content:center;gap:22px">
  <div><p class="k">THE OTHER SIDE</p><h1 style="font-size:clamp(40px,4.4vw,72px);margin-top:8px">The censor keeps learning.</h1>
  <p class="mute" style="font-size:20px;max-width:78ch;margin-top:12px">Not one agency but a layered system: the Party's cyberspace commission (CAC) draws the lines, the Ministry of Public Security's internet police enforce them, State Security hunts “foreign infiltration”, and the platforms delete.</p></div>
  <div class="tl">${ENEMY.map(([y,h,t],i)=>`<div class="ev ${i===ENEMY.length-1?"now":""}"><i></i><b>${esc(y)}</b><span><strong>${esc(h)}</strong><br>${esc(t)}</span></div>`).join("")}</div>
  <p class="quote">Codes that spread end up on the filter lists. Resistance is a moving target – one reason artists like Badiucao and Ai Weiwei work from outside China.</p>
  <p class="src">Sources: Freedom House, Freedom on the Net: China (2023–2025); China Digital Times; Reuters.</p>
  </section>${ctrl()}</div>`,bindCtrl);
 $("#hp").textContent="The opponent";
}
function ctrl(){
 const st=S.state||{phase:"lobby"};
 const b=(a,t,p)=>`<button class="cb ${p?"p":""}" data-a="${a}">${t}</button>`;
 let m="";
 if(st.phase==="lobby") m=b("start",`Open platform · ${CREATE_MIN} min ▶`,1);
 if(st.phase==="create") m=b("plus","+1 min")+b("vote","End posting → start vote ▶",1);
 if(st.phase==="vote") m=b("prev","◀ Back")+(st.revealed?b("next",st.cur+1<order().length?"Next post ▶":"Reality check ▶",1):b("reveal","Reveal ▶",1));
 if(st.phase==="reality") m=b("prev","◀ Back")+(st.rrev?b("next",(st.rcur||0)+1<REAL.length?"Next case ▶":"Final screen ▶",1):b("reveal","Reveal ▶",1));
 if(st.phase==="final") m=b("prev","◀ Back")+b("next","Theory ▶",1);
 if(st.phase==="theory") m=b("prev","◀ Back")+b("next","The censor evolves ▶",1);
 if(st.phase==="enemy") m=b("prev","◀ Back");
 return `<div class="ctrl">${m}<span class="sp"></span><span class="prog">Space / → = next step</span>${b("reset","Reset session")}</div>`;
}
function bindCtrl(){ $$(".cb").forEach(x=>x.onclick=()=>act(x.dataset.a,x)); }
let resetArm=0;
async function act(a,el){
 const st=S.state||{phase:"lobby"}, u=o=>update(R("state"),o);
 if(a==="start") return u({phase:"create",endsAt:now()+CREATE_MIN*60000,cur:0,revealed:false,rcur:0,rrev:false});
 if(a==="plus") return u({endsAt:(st.endsAt||now())+60000});
 if(a==="vote"){const subs=S.subs||{};const o=Object.keys(subs).sort((x,y)=>subs[x].t-subs[y].t);await set(R("order"),o);return u(o.length?{phase:"vote",cur:0,revealed:false}:{phase:"reality",rcur:0,rrev:false})}
 if(a==="reveal") return u(st.phase==="vote"?{revealed:true}:{rrev:true});
 if(a==="next"){
  if(st.phase==="final") return u({phase:"theory"});
  if(st.phase==="theory") return u({phase:"enemy"});
  if(st.phase==="vote") return st.cur+1<order().length?u({cur:st.cur+1,revealed:false}):u({phase:"reality",rcur:0,rrev:false});
  if(st.phase==="reality") return (st.rcur||0)+1<REAL.length?u({rcur:(st.rcur||0)+1,rrev:false}):u({phase:"final"});
 }
 if(a==="prev"){
  if(st.phase==="vote") return st.revealed?u({revealed:false}):st.cur>0?u({cur:st.cur-1,revealed:true}):null;
  if(st.phase==="reality") return st.rrev?u({rrev:false}):st.rcur>0?u({rcur:st.rcur-1,rrev:true}):(order().length?u({phase:"vote",cur:order().length-1,revealed:true}):null);
  if(st.phase==="final") return u({phase:"reality",rcur:REAL.length-1,rrev:true});
  if(st.phase==="theory") return u({phase:"final"});
  if(st.phase==="enemy") return u({phase:"theory"});
 }
 if(a==="reset"){
  if(Date.now()-resetArm>3000){resetArm=Date.now();el.textContent="Click again to wipe everything";return}
  busy.clear(); return set(R(),{state:{phase:"lobby"}});
 }
}
if(HOST) addEventListener("keydown",e=>{
 if(e.target.tagName==="INPUT")return;
 const st=S.state||{phase:"lobby"};
 if(e.key===" "||e.key==="ArrowRight"){e.preventDefault();
  if(st.phase==="lobby")act("start");else if(st.phase==="create")act("vote");
  else if(st.phase==="vote")act(st.revealed?"next":"reveal");else if(st.phase==="reality")act(st.rrev?"next":"reveal");else if(st.phase==="final"||st.phase==="theory")act("next");}
 if(e.key==="ArrowLeft")act("prev");
});

setInterval(()=>{
 const st=S.state||{};
 $$("[data-end]").forEach(el=>{const left=(st.endsAt||0)-now();el.textContent=fmt(left);el.classList.toggle("low",left<60000)});
 if(!HOST&&st.phase==="create"&&st.endsAt&&st.endsAt-now()<1500&&!autoSent&&dirty&&cv){autoSent=true;submit()}
},250);
onValue(R(),s=>{
 S=s.val()||{};
 if(S.state?.phase!=="create") autoSent=false;
 if(S.state?.phase!=="create"){cv=null;cx=null}
 if(!S.state&&HOST) set(R("state"),{phase:"lobby"});
 if(!HOST&&!(S.subs||{})[cid]&&S.state?.phase==="lobby"){M={...M,bg:"white",items:[],sel:-1,photo:null,drew:false,init:false};if(strokes)strokes.getContext("2d").clearRect(0,0,720,720)}
 try{HOST?renderHost():renderPhone()}catch(e){console.error("[w404]",e)}
},e=>{ $("#app").innerHTML=`<div class="ph"><div class="wait"><h2>Connection blocked</h2><p class="mute">${esc(e.message)}</p></div></div>`});
if(HOST) getModel();
</script>
