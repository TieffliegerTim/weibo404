 if(st.phase==="reality") m=b("prev","◀ Back")+(st.rrev?b("next",(st.rcur||0)+1<REAL.length?"Next case ▶":"Final screen ▶",1):b("reveal","Reveal ▶",1));
 if(st.phase==="final") m=b("prev","◀ Back");
 return `<div class="ctrl">${m}<span class="sp"></span><span class="prog">Space / → = next step</span>${b("reset","Reset session")}</div>`;
}
function bindCtrl(){ $$(".cb").forEach(x=>x.onclick=()=>act(x.dataset.a,x)); }
let resetArm=0;
async function act(a,el){
 const st=S.state||{phase:"lobby"}, u=o=>update(R("state"),o);
 if(a==="start") return u({phase:"create",endsAt:now()+CREATE_MIN*60000,cur:0,revealed:false,rcur:0,rrev:false});
 if(a==="plus") return u({endsAt:(st.endsAt||now())+60000});
 if(a==="vote"){const subs=S.subs||{};const o=Object.keys(subs).sort((x,y)=>subs[x].t-subs[y].t);await set(R("order"),o);return u(o.length?{phase:"vote",cur:0,revealed:false}:{phase:"reality",rcur:0,rrev:false})}
 if(a==="reveal") return u(st.phase==="vote"?{revealed:true}:{rrev:true});
 if(a==="next"){
  if(st.phase==="vote") return st.cur+1<order().length?u({cur:st.cur+1,revealed:false}):u({phase:"reality",rcur:0,rrev:false});
  if(st.phase==="reality") return (st.rcur||0)+1<REAL.length?u({rcur:(st.rcur||0)+1,rrev:false}):u({phase:"final"});
 }
 if(a==="prev"){
  if(st.phase==="vote") return st.revealed?u({revealed:false}):st.cur>0?u({cur:st.cur-1,revealed:true}):null;
  if(st.phase==="reality") return st.rrev?u({rrev:false}):st.rcur>0?u({rcur:st.rcur-1,rrev:true}):(order().length?u({phase:"vote",cur:order().length-1,revealed:true}):null);
  if(st.phase==="final") return u({phase:"reality",rcur:REAL.length-1,rrev:true});
 }
 if(a==="reset"){
  if(Date.now()-resetArm>3000){resetArm=Date.now();el.textContent="Click again to wipe everything";return}
  busy.clear(); return set(R(),{state:{phase:"lobby"}});
 }
}
if(HOST) addEventListener("keydown",e=>{
 if(e.target.tagName==="INPUT")return;
 const st=S.state||{phase:"lobby"};
 if(e.key===" "||e.key==="ArrowRight"){e.preventDefault();
  if(st.phase==="lobby")act("start");else if(st.phase==="create")act("vote");
  else if(st.phase==="vote")act(st.revealed?"next":"reveal");else if(st.phase==="reality")act(st.rrev?"next":"reveal");}
 if(e.key==="ArrowLeft")act("prev");
});

setInterval(()=>{
 const st=S.state||{};
 $$("[data-end]").forEach(el=>{const left=(st.endsAt||0)-now();el.textContent=fmt(left);el.classList.toggle("low",left<60000)});
 if(!HOST&&st.phase==="create"&&st.endsAt&&st.endsAt-now()<1500&&!autoSent&&dirty&&cv){autoSent=true;submit()}
},250);
onValue(R(),s=>{
 S=s.val()||{};
 if(S.state?.phase!=="create") autoSent=false;
 if(!S.state&&HOST) set(R("state"),{phase:"lobby"});
 try{HOST?renderHost():renderPhone()}catch(e){console.error("[w404]",e)}
},e=>{ $("#app").innerHTML=`<div class="ph"><div class="wait"><h2>Connection blocked</h2><p class="mute">${esc(e.message)}</p></div></div>`});
if(HOST) getModel();
</script>
</body>
